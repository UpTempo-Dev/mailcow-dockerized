name: uptempo-files-local-test
services:
  webmail:
    ports: !override ["127.0.0.1:19847:80"]
    depends_on: [uploads, testmail]
    environment:
      UPTEMPO_FILES_LOCAL_TEST: "1"
      ROUNDCUBEMAIL_DEFAULT_HOST: testmail
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: testmail
      ROUNDCUBEMAIL_SMTP_PORT: 3025
    volumes:
      - ./tests:/opt/uptempo-tests:ro
      - ./tests/local.inc.php:/etc/mailcow-webmail.crt:ro
      - ./tests/local.inc.php:/var/roundcube/config/zz-test.inc.php:ro
  testmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email -Dgreenmail.users=test:local-test@example.test,reader:local-reader@example.test"
    networks: [mailcow]
networks:
  mailcow: !override
    ipam:
      config: [{subnet: 10.246.81.0/28}]
  files:
    ipam:
      config: [{subnet: 10.246.81.16/28}]
